<title>NFL Confidence Pool</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #6b6b6b;
    --line: #d9d9d9;
    --pill: #f2f2f2;
    --pill-hover: #e6e6e6;
    --pick: #111111;
    --pick-fg: #ffffff;
    --drag: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #eeeeee;
      --muted: #999999;
      --line: #333333;
      --pill: #1e1e1e;
      --pill-hover: #2a2a2a;
      --pick: #eeeeee;
      --pick-fg: #111111;
      --drag: #1a1a1a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  select, button {
    font: inherit;
    color: var(--fg);
    background: var(--pill);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button:hover, select:hover { background: var(--pill-hover); }
  #status { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 20px 60px; }
  #games { list-style: none; padding: 0; margin: 0; }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr 24px 1fr;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    cursor: grab;
    user-select: none;
  }
  .row.dragging { opacity: 0.4; }
  .row.drop-target { background: var(--drag); }
  .rank {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .at { text-align: center; color: var(--muted); font-size: 13px; }
  .team {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--pill);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    min-width: 0;
  }
  .team:hover { background: var(--pill-hover); }
  .team.picked {
    background: var(--pick);
    color: var(--pick-fg);
    border-color: var(--pick);
  }
  .team img {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    object-fit: contain;
  }
  .team .name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .team.away { justify-content: flex-end; text-align: right; }
  .team.away .name { order: -1; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>

</header>
<main>

</main>

const SEASON = SCHEDULE.season;
const WEEKS = 18; // regular season only
const STORAGE_KEY = (w) => `nflpool:${SEASON}:w${w}`;

const $week = document.getElementById("week");
const $games = document.getElementById("games");
const $status = document.getElementById("status");
const $reset = document.getElementById("reset");

for (let w = 1; w <= WEEKS; w++) {
  const opt = document.createElement("option");
  opt.value = w;
  opt.textContent = `Week ${w}`;
  $week.appendChild(opt);
}

// Guess the current week from date: Sept 1 ≈ start of week 1.
function guessWeek() {
  const start = new Date(SEASON, 8, 4); // Sept 4-ish; NFL kickoff Thursday
  const days = Math.floor((Date.now() - start.getTime()) / 86400000);
  const w = Math.floor(days / 7) + 1;
  return Math.min(Math.max(w, 1), WEEKS);
}
$week.value = guessWeek();

let currentGames = []; // [{id, away:{abbr,name,logo}, home:{...}}]
let state = { order: [], picks: {} }; // order = array of game ids; picks[id] = 'home'|'away'

function loadState(week) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY(week));
    if (raw) return JSON.parse(raw);
  } catch {}
  return { order: [], picks: {} };
}
function saveState(week) {
  localStorage.setItem(STORAGE_KEY(week), JSON.stringify(state));
}

function loadWeek(week) {
  currentGames = (SCHEDULE.weeks[String(week)] || []).map(g => ({
    id: g.id,
    home: { ...g.home, logo: `https://a.espncdn.com/i/teamlogos/nfl/500/${g.home.abbr.toLowerCase()}.png` },
    away: { ...g.away, logo: `https://a.espncdn.com/i/teamlogos/nfl/500/${g.away.abbr.toLowerCase()}.png` },
  }));

  state = loadState(week);
  // Reconcile order with actual games: keep known ids in their saved order,
  // append any new games at the bottom, drop stale ids.
  const known = new Set(currentGames.map(g => g.id));
  const savedOrdered = state.order.filter(id => known.has(id));
  const missing = currentGames.map(g => g.id).filter(id => !savedOrdered.includes(id));
  state.order = [...savedOrdered, ...missing];
  saveState(week);

  render(week);
  $status.textContent = `${currentGames.length} games`;
}

function render(week) {
  $games.innerHTML = "";
  if (currentGames.length === 0) {
    $games.innerHTML = '<li class="empty">No games this week.</li>';
    return;
  }
  // Ranks always count down from 16 so bye weeks use e.g. 16..4 instead of 13..1.
  state.order.forEach((id, i) => {
    const g = currentGames.find(x => x.id === id);
    if (!g) return;
    const rank = 16 - i;
    const li = document.createElement("li");
    li.className = "row";
    li.draggable = true;
    li.dataset.id = id;

    const rankEl = document.createElement("div");
    rankEl.className = "rank";
    rankEl.textContent = rank;

    const awayEl = teamPill(g.away, "away", state.picks[id] === "away");
    awayEl.addEventListener("click", (e) => { e.stopPropagation(); pick(id, "away", week); });

    const atEl = document.createElement("div");
    atEl.className = "at";
    atEl.textContent = "@";

    const homeEl = teamPill(g.home, "home", state.picks[id] === "home");
    homeEl.addEventListener("click", (e) => { e.stopPropagation(); pick(id, "home", week); });

    li.append(rankEl, awayEl, atEl, homeEl);
    attachDrag(li, week);
    $games.appendChild(li);
  });
}

function teamPill(team, side, picked) {
  const el = document.createElement("div");
  el.className = `team ${side}${picked ? " picked" : ""}`;
  const img = document.createElement("img");
  img.src = team.logo;
  img.alt = "";
  img.onerror = () => { img.style.display = "none"; };
  const nm = document.createElement("span");
  nm.className = "name";
  nm.textContent = team.name;
  el.append(img, nm);
  return el;
}

function pick(gameId, side, week) {
  if (state.picks[gameId] === side) delete state.picks[gameId];
  else state.picks[gameId] = side;
  saveState(week);
  render(week);
}

// --- HTML5 native drag & drop ---
let dragId = null;
function attachDrag(li, week) {
  li.addEventListener("dragstart", (e) => {
    dragId = li.dataset.id;
    li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId);
  });
  li.addEventListener("dragend", () => {
    dragId = null;
    document.querySelectorAll(".row").forEach(r => r.classList.remove("dragging", "drop-target"));
  });
  li.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".row").forEach(r => r.classList.remove("drop-target"));
    li.classList.add("drop-target");
  });
  li.addEventListener("dragleave", () => li.classList.remove("drop-target"));
  li.addEventListener("drop", (e) => {
    e.preventDefault();
    const src = dragId;
    const dst = li.dataset.id;
    if (!src || src === dst) return;
    const from = state.order.indexOf(src);
    const to = state.order.indexOf(dst);
    state.order.splice(from, 1);
    state.order.splice(to, 0, src);
    saveState(week);
    render(week);
  });
}

$week.addEventListener("change", () => loadWeek(parseInt($week.value, 10)));
$reset.addEventListener("click", () => {
  if (!confirm("Clear picks and order for this week?")) return;
  const w = parseInt($week.value, 10);
  localStorage.removeItem(STORAGE_KEY(w));
  loadWeek(w);
});

loadWeek(parseInt($week.value, 10));
